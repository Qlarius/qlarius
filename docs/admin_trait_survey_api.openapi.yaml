openapi: 3.0.3
info:
  title: Qlarius admin trait and survey API
  version: "1"
  description: |
    Admin-only JSON API for catalog vocabulary. Bearer token or an admin
    browser session. Audit columns use the authenticated admin user.

    Design packs restripe active sibling display_order to 1..N after the
    write (requested order, then name, then id). Soft-deactivated children
    leave consumer answer lists. Their MeFile tags stay until a later
    trait migration. Age (parent id 93) and single_select_zip parents reject
    child replacement and input_type changes unless force is true. Force
    does not remap tags.

    Dropped columns is_taggable, immutable, and max_selected are not accepted.

    meta_1, meta_2, and meta_3 are optional lookup fields (text, no length cap).
    Omit a key to leave the stored value. Send null or "" to clear it.
    Zip children use meta_1 for "City, State" and meta_2 for "STANDARD".
    Occupation children should use trait_name for the title, meta_1 for the
    SOC code, meta_2 for the major-group code, and meta_3 for extra search text.

    has_search_filter on a parent shows a client-side search box in tagging
    modals. The box matches the child title, survey answer, and meta_1,
    meta_2, and meta_3. Omit the key to leave the stored value. Zip parents
    keep the zip picker.
    GET /api/admin/traits/{id}/lookup matches title and all three meta fields.
servers:
  - url: /
paths:
  /api/admin/tokens:
    post:
      summary: Issue a bearer token for an admin user
      security: [{bearerAuth: []}, {sessionAuth: []}]
      responses:
        "200":
          description: Raw token, returned once
  /api/admin/tokens/{id}:
    delete:
      summary: Revoke a token
      responses:
        "200":
          description: Revoked
  /api/admin/trait_categories:
    get:
      summary: List trait categories
      responses:
        "200":
          description: Categories in display order
    post:
      summary: Create a trait category
      responses:
        "201":
          description: Created
  /api/admin/trait_categories/{id}:
    patch:
      summary: Rename or reorder a category
      responses:
        "200":
          description: Updated
  /api/admin/traits:
    get:
      summary: List parent traits
      parameters:
        - in: query
          name: q
          schema: {type: string}
          description: Case-insensitive name contains
        - in: query
          name: category_id
          schema: {type: integer}
        - in: query
          name: include_inactive
          schema: {type: boolean}
      responses:
        "200":
          description: Active parents unless include_inactive is set
  /api/admin/traits/{id}:
    get:
      summary: Parent detail including inactive children, tag counts, and survey texts
      responses:
        "200":
          description: Parent detail
    patch:
      summary: Update a parent trait, or update a child trait by id
      description: >
        If {id} is a parent id, updates the parent fields.
        If {id} is a child id, updates the child fields, including is_exclusive.
      responses:
        "200":
          description: Updated parent detail (for parents) or updated child detail (for children)
        "422":
          description: Protected parent, invalid input_type, or multiple tags without force
  /api/admin/traits/design_packs:
    post:
      summary: Create or reform a parent with children and survey copy
      description: >
        If no active child has is_skipped_tag, one is added with the label
        Prefer not to say. That label is not searched. Zip parents are unchanged.
        Set is_skipped_tag on a child the pack already includes to use that child
        as the opt-out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, parent, children, survey_question]
              properties:
                mode: {type: string, enum: [create, reform]}
                force: {type: boolean}
                dry_run: {type: boolean}
                deactivate_missing_children: {type: boolean}
                extend_exclusive_conflicts: {type: boolean}
                parent:
                  type: object
                  properties:
                    id: {type: integer}
                    trait_name: {type: string, maxLength: 256}
                    input_type: {type: string, enum: [single_select, multi_select, single_select_zip]}
                    trait_category_id: {type: integer, nullable: true}
                    category_name_hint: {type: string}
                    display_order: {type: integer}
                    is_active: {type: boolean}
                    has_search_filter: {type: boolean}
                    meta_1: {type: string, nullable: true}
                    meta_2: {type: string, nullable: true}
                    meta_3: {type: string, nullable: true}
                survey_question:
                  type: object
                  properties:
                    text: {type: string, maxLength: 4096}
                children:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      id: {type: integer}
                      trait_name: {type: string, maxLength: 256}
                      display_order: {type: integer}
                      is_active: {type: boolean}
                      is_skipped_tag: {type: boolean}
                      is_exclusive: {type: boolean}
                      survey_answer_text: {type: string, maxLength: 4096}
                      meta_1: {type: string, nullable: true}
                      meta_2: {type: string, nullable: true}
                      meta_3: {type: string, nullable: true}
                attach_to_survey:
                  type: object
                  properties:
                    survey_id: {type: integer, nullable: true}
                    survey_name_hint: {type: string}
                    display_order: {type: integer}
      responses:
        "200":
          description: >
            Parent detail plus deactivated_child_ids and deactivated_tag_count.
            When dry_run is true, the response includes dry_run true and rolled_back true.
        "422":
          description: Empty pack, ambiguous hint, protected parent, or validation error
  /api/admin/traits/{id}/lookup:
    get:
      summary: Search active children by title or meta_1, meta_2, meta_3
      parameters:
        - in: query
          name: q
          schema: {type: string}
          description: At least 2 characters. Case-insensitive contains match.
        - in: query
          name: limit
          schema: {type: integer, maximum: 200, default: 50}
      responses:
        "200":
          description: Matching children with trait_name and meta fields
  /api/admin/traits/{id}/children:
    post:
      summary: Batch-create children under a parent
      responses:
        "201":
          description: Created children
        "422":
          description: Child under a child, or protected parent
  /api/admin/traits/{id}/children/{child_id}:
    patch:
      summary: Rename, reorder, or deactivate a child
      responses:
        "200":
          description: Updated child
  /api/admin/traits/{id}/children/{child_id}/make_exclusive:
    post:
      summary: Add conflicts links from one child to its siblings
      description: >
        Adds conflicts links between the child and every other active non-skip sibling.
        Use exclude_skip false only to keep or create links involving the skip answer.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string}
                include_inactive: {type: boolean}
                exclude_skip: {type: boolean}
      responses:
        "200":
          description: Summary with created, skipped, and relationship_ids
  /api/admin/traits/{id}/children/{child_id}/unmake_exclusive:
    post:
      summary: Remove conflicts links between a child and its siblings
      responses:
        "200":
          description: Summary with deleted and relationship_ids
  /api/admin/traits/{id}/deactivate:
    post:
      summary: Soft-deactivate a trait
      responses:
        "200":
          description: is_active false
  /api/admin/traits_catalog:
    get:
      summary: Active catalog, traits_index plus input_type, survey texts, and active_survey_ids
      responses:
        "200":
          description: >
            Categories, parents, and active children. Each parent includes
            active_survey_ids, the surveys with active true that present
            that parent's question.
  /api/admin/surveys:
    get:
      summary: List surveys with question membership order
      responses:
        "200":
          description: Surveys
    post:
      summary: Create a survey
      responses:
        "201":
          description: Created survey
  /api/admin/surveys/{id}:
    patch:
      summary: Update survey name, active, order, or category
      responses:
        "200":
          description: Updated survey
  /api/admin/surveys/{id}/questions:
    post:
      summary: Attach a survey question and set its order
      responses:
        "200":
          description: Survey with questions
  /api/admin/surveys/{id}/questions/{question_id}:
    delete:
      summary: Remove a question from a survey
      responses:
        "204":
          description: Removed
  /api/admin/survey_questions/{id}:
    patch:
      summary: Update question text
      responses:
        "200":
          description: Updated question
  /api/admin/survey_answers/{id}:
    patch:
      summary: Update expanded answer text
      responses:
        "200":
          description: Updated answer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionAuth:
      type: apiKey
      in: cookie
      name: _qlarius_key
