openapi: 3.0.3
info:
  title: Qadabra admin creator API
  version: "2026-11-01.2"
  description: >
    Bearer token on /api/admin. Every create requires api_ref. Every write
    accepts dry_run. Price fields are rejected. See priv/agent_guides/creators.md.
servers:
  - url: /api/admin
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: {type: integer}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
        guide: {type: string}
security:
  - bearer: []
paths:
  /creators:
    get:
      summary: List creators, recipients, and catalogs
      parameters:
        - in: query
          name: q
          schema: {type: string}
        - in: query
          name: api_ref_prefix
          schema: {type: string}
      responses:
        "200": {description: Creator list}
    post:
      summary: Create a creator and one approved recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_ref, name]
              properties:
                api_ref: {type: string}
                name: {type: string}
                bio: {type: string}
                image_url: {type: string, format: uri}
                dry_run: {type: boolean}
                on_existing: {type: string, enum: [skip, update]}
                recipient:
                  type: object
                  properties:
                    site_url: {type: string}
                    description: {type: string}
                    message: {type: string}
                    graphic_url: {type: string, format: uri}
                    recipient_type_id: {type: integer, default: 1}
                    api_ref: {type: string}
      responses:
        "201": {description: Created}
        "200": {description: Matched an existing api_ref}
        "422": {description: Validation, missing api_ref, or a price field}
  /creators/{id}:
    get:
      summary: Show a creator
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Creator}
    patch:
      summary: Update a creator and its recipient
      description: >
        image_url (http or https) sets or replaces the creator image. The
        stored file name changes, so the public URL changes even when the
        source URL differs only by a query string. GET returns image_url as
        an absolute URL. dry_run reports differences.image (current, requested)
        and does not download. A non-http(s) URL, a failed download, or a
        non-image is 422.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Updated or would_update}
  /creators/{id}/embeds:
    get:
      summary: Widget paths for the primary recipient, plus a recipients array
      description: >
        Top-level split_code, referral_code, sponster_bar, and insta_tip stay
        on the primary. recipients lists each publication with its own codes,
        sponster_bar, insta_tip, and the catalogs that map to it.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Embed payload}
  /creators/{id}/recipients:
    get:
      summary: Recipients for a creator
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Recipient list, primary first}
    post:
      summary: Add a recipient under a creator
      description: >
        api_ref is required. The same key returns the existing row. dry_run is
        supported. The recipient is auto-approved, owned by the token's admin
        user, and receives a generated split_code. The first recipient is
        primary; later ones are not. Example: creator Cities West Media,
        then PHOENIX Magazine (https://phoenixmag.com) as the primary and
        Phoenix Home & Garden (https://phgmag.com) as the second recipient,
        each with one catalog.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "201": {description: Created}
        "200": {description: Matched an existing api_ref}
        "422": {description: Validation, missing api_ref, or a price field}
  /creators/{id}/recipients/{recipient_id}:
    get:
      summary: One recipient of a creator
      parameters:
        - $ref: "#/components/parameters/id"
        - in: path
          name: recipient_id
          required: true
          schema: {type: integer}
      responses:
        "200": {description: Recipient}
    patch:
      summary: Update a creator's recipient
      description: Send is_primary true to make this the primary recipient.
      parameters:
        - $ref: "#/components/parameters/id"
        - in: path
          name: recipient_id
          required: true
          schema: {type: integer}
      responses:
        "200": {description: Updated}
        "422": {description: Validation, or clearing the only primary}
    delete:
      summary: Delete a recipient with no ledger activity
      parameters:
        - $ref: "#/components/parameters/id"
        - in: path
          name: recipient_id
          required: true
          schema: {type: integer}
      responses:
        "200": {description: Deleted or would_delete}
        "409": {description: Ledger entries or catalogs still reference it}
        "422": {description: Still the primary while another recipient exists}
  /creators/{id}/recipients/{recipient_id}/archive:
    post:
      summary: Archive a recipient
      parameters:
        - $ref: "#/components/parameters/id"
        - in: path
          name: recipient_id
          required: true
          schema: {type: integer}
      responses:
        "200": {description: Archived or would_archive}
        "409": {description: Ledger entries still exist}
        "422": {description: Still the primary while another recipient exists}
  /creators/{id}/catalogs:
    get:
      summary: Catalogs for a creator
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Catalog list}
    post:
      summary: Create a catalog
      description: >
        Optional recipient_id assigns the catalog to one of this creator's
        recipients. Omit it and the catalog uses the primary. Tiqit revenue
        posts to that recipient's ledger.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "201": {description: Created}
        "422": {description: Validation, or a recipient from another creator}
  /recipients:
    get:
      summary: List recipients
      parameters:
        - in: query
          name: recipient_type_id
          schema: {type: integer}
      responses:
        "200": {description: Recipient list, including split_code}
    post:
      summary: Create a recipient with no creator
      responses:
        "201": {description: Created}
  /recipients/{id}:
    get:
      summary: Show a recipient
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Recipient}
    patch:
      summary: Update a recipient
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Updated}
  /catalogs/{id}:
    get:
      summary: Show a catalog
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Catalog}
    patch:
      summary: Update a catalog
      description: >
        image_url (http or https) sets or replaces the catalog image and
        changes the stored file name. GET returns absolute image_url.
        dry_run reports differences.image without downloading. A non-http(s)
        URL, a failed download, or a non-image is 422.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Updated}
    delete:
      summary: Delete a catalog
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Deleted or would_delete}
        "409": {description: Dependent groups or pieces}
  /catalogs/{id}/content_groups:
    post:
      summary: Create a content group
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "201": {description: Created}
  /content_groups/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Show a content group
      responses:
        "200": {description: Group}
    patch:
      summary: Update a content group
      description: |
        Top-level keys include title, description, image_url, feed fields, and
        the display booleans show_piece_thumbnails (default false),
        show_piece_descriptions (default true), and show_open_in_tab (default true).
        image_url (http or https) sets or replaces the group image. The stored
        file name changes, so the public URL changes even when the source URL
        differs only by a query string. GET returns image_url as an absolute URL.
        dry_run reports differences.image (current, requested) and does not download.
        A non-http(s) URL, a failed download, or a non-image is 422.
        These display booleans exist only on the content group. dry_run returns
        would_update and differences without saving; content_group in that body
        is the stored row. Price keys return 422 price_not_writable.
      responses:
        "200": {description: Updated, including the three display booleans}
        "422": {description: Invalid, or a price field was sent}
    delete:
      summary: Delete a content group
      responses:
        "409": {description: Dependent pieces}
  /content_groups/{id}/pieces:
    post:
      summary: Create a piece
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "201": {description: Created}
    get:
      summary: List pieces
      parameters:
        - $ref: "#/components/parameters/id"
        - in: query
          name: archived
          schema: {type: string, enum: [only, all]}
      responses:
        "200": {description: Active pieces, unless archived is set}
  /content_groups/{id}/pieces/reorder:
    post:
      summary: Reorder active pieces
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Reordered}
        "422": {description: piece_ids is not the active set}
  /content_pieces/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Show a piece
      responses:
        "200": {description: Piece}
    patch:
      summary: Update a piece
      description: >
        image_url (http or https) sets or replaces the piece image. GET returns
        absolute image_url. dry_run reports differences.image without downloading.
        A non-http(s) URL, a failed download, or a non-image is 422.
      responses:
        "200": {description: Updated}
        "422": {description: A price field was sent}
    delete:
      summary: Delete a piece with no purchases
      responses:
        "409": {description: Piece has purchases or is archived}
  /content_pieces/{id}/archive:
    post:
      summary: Archive a piece
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Archived}
  /content_pieces/{id}/unarchive:
    post:
      summary: Unarchive a piece
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Unarchived}
  /tiqit_classes:
    get:
      summary: Read tiqit classes
      parameters:
        - in: query
          name: catalog_id
          schema: {type: integer}
        - in: query
          name: content_group_id
          schema: {type: integer}
        - in: query
          name: content_piece_id
          schema: {type: integer}
      responses:
        "200": {description: Classes}
  /youtube/preview:
    get:
      summary: Preview a YouTube channel or playlist
      parameters:
        - in: query
          name: input
          required: true
          schema: {type: string}
      responses:
        "200": {description: Preview}
        "503": {description: YOUTUBE_DATA_API_KEY is not configured}
  /content_groups/youtube_imports:
    post:
      summary: Import a YouTube channel or playlist
      responses:
        "201": {description: Group created and new videos imported}
        "200": {description: Group matched; existing video ids were not duplicated}
        "503": {description: YOUTUBE_DATA_API_KEY is not configured}
  /content_groups/rss_imports:
    post:
      summary: Import an RSS feed
      description: >
        Accepts strip_patterns, drop_patterns, api_ref, and dry_run.
        dry_run reports kept, dropped, and cleaned.
      responses:
        "200": {description: Import result}
  /content_groups/{id}/sync:
    post:
      summary: Sync a group's feed
      description: >
        Refreshes audio URL, duration, and episode fields. refresh_existing
        true also refreshes title and description. strip_patterns and
        drop_patterns apply to this run only.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": {description: Sync result}
